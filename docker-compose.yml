services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container URL (overrides the localhost value in .env)
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models/hf
      SENTENCE_TRANSFORMERS_HOME: /models/hf
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/models/hf
    depends_on:
      qdrant:
        condition: service_started

volumes:
  qdrant_storage:
  hf_cache:
